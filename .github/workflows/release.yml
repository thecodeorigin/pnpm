name: Release

on:
  workflow_dispatch:
    inputs:
      ecosystem-sha:
        description: Exact ecosystem commit that pins this project commit
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  release:
    if: github.repository == 'thecodeorigin/pnpm'
    runs-on: ubuntu-24.04
    steps:
      - name: Load ecosystem checkout credential from Vault
        uses: thecodeorigin/actions/vault-environment@4bff26b9e9ac41c293f82a294a5eb2a262648a87
        with:
          token: ${{ secrets.THECODEORIGIN_VAULT_TOKEN }}
          project: pnpm
          environment: production
          deployment-kind: production
          keys: '["ECOSYSTEM_CHECKOUT_TOKEN"]'
      - name: Check out, install, and check the pinned workspace
        uses: thecodeorigin/actions/ecosystem-workspace@bbe1e137484e07f6e7424dde12c0c7d7207ff425
        with:
          ecosystem-sha: ${{ inputs.ecosystem-sha }}
          project-path: configs/pnpm
          operation: check
      - name: Build package
        working-directory: ecosystem/configs/pnpm
        run: pnpm build:package
      - name: Release package
        working-directory: ecosystem/configs/pnpm
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
